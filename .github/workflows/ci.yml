name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Correr tests
        run: |
          chmod +x mvnw
          ./mvnw -B test

      - name: Construir la imagen de Docker
        run: docker build -t restaurante-api .
